    if (r && r.v === 1 && (r.total || 0) >= prog.total) { prog = Object.assign(EMPTY(), r); saveLocal(); changed = true; }
    if (!prog.migratedLC) {
      const o = await db.doc("data/users/" + uid + "/progress").get();
      if (o.exists && migrateLC(o.data())) changed = true; else prog.migratedLC = true;
    }
    clearTimeout(timer);
    sync = "synced";
    if (changed || prog.total) persist(true);
    if (changed && view !== "run") render();
  } catch (e) { clearTimeout(timer); sync = "local"; }
  renderFoot();
}
function renderFoot() {
  const t = { local: "Progress is saved in this browser.", loading: "Connecting to your account…", synced: "Progress is saved to your account. Anyone you share this with gets their own.", error: "Couldn't save to your account just now; this browser keeps a copy." }[sync];
  $("#foot").textContent = `${t} ${ITEMS.length} cards: ${TEMPLATES.length} LeetCode problem types and ${ITEMS.length - TEMPLATES.length} ML cards.`;
}
document.addEventListener("visibilitychange", () => { if (document.hidden && docRef) { clearTimeout(saveTimer); flush(); } });

// ===== item state =====
function st(id) { return prog.items[id]; }
function stateOf(id) { const s = st(id); if (!s) return "n"; if (s.fs >= AUTO_STREAK) return "a"; if (s.lastWrong) return "m"; return "l"; }
function counts(filter) { const c = { n: 0, l: 0, m: 0, a: 0, total: 0 }; ITEMS.filter(filter).forEach(i => { c[stateOf(i.id)]++; c.total++; }); return c; }
function mastery(p) { const r = (prog.pat[p] && prog.pat[p].r) || ""; if (!r) return null; let num = 0.5, den = 1, w = 1; for (let i = r.length - 1; i >= 0; i--) { num += w * (r[i] === "1" ? 1 : 0); den += w; w *= 0.85; } return num / den; }

function record(c, k, ok, ms) {
  const target = CATS[c.cat].target;
  const s = prog.items[c.id] || (prog.items[c.id] = { n: 0, c: 0, fs: 0, best: 0, last: 0, lastWrong: false });
  const wasAuto = s.fs >= AUTO_STREAK;
  s.n++; s.last = Date.now();
  if (ok) { s.c++; s.lastWrong = false; if (ms <= target) s.fs++; s.best = s.best ? Math.min(s.best, ms) : ms; }
  else { s.fs = 0; s.lastWrong = true; }
  prog.total++; if (ok) prog.correct++;
  const d = prog.days[today()] || (prog.days[today()] = { n: 0, c: 0 }); d.n++; if (ok) d.c++;
  const C = prog.cats[c.cat] || (prog.cats[c.cat] = { n: 0, c: 0, ms: 0 }); C.n++; if (ok) C.c++; C.ms += Math.min(ms, 600000);
  if (c.cat === "leetcode") {
    const P = prog.pat[c.p] || (prog.pat[c.p] = { n: 0, c: 0, ms: 0, r: "" });
    P.n++; if (ok) P.c++; P.ms += Math.min(ms, 600000); P.r = (P.r + (ok ? "1" : "0")).slice(-20);
    if (!ok) { const key = c.keys[k] + "|" + c.p; prog.conf[key] = (prog.conf[key] || 0) + 1; }
  }
  persist();
  return { becameAuto: !wasAuto && s.fs >= AUTO_STREAK };
}

// ===== run construction =====
function weight(id) {
  const s = st(id); if (!s) return 1;
  if (s.lastWrong) return 3;
  if (s.fs < AUTO_STREAK) return 2.2;
  return Math.min(1.2, 0.15 + ((Date.now() - s.last) / 864e5) * 0.15);
}
function buildRun() {
  const pool = ITEMS.filter(MODE[mode][3]), picked = [], used = new Set(); let fresh = 0;
  for (let guard = 0; picked.length < RUN_LEN && guard < 2000; guard++) {
    const cands = pool.filter(i => !used.has(i.id) || i.gen || i.lc).filter(i => !(stateOf(i.id) === "n" && fresh >= 10));
    const list = cands.length ? cands : pool;
    const ws = list.map(i => weight(i.id) * (used.has(i.id) ? 0.3 : 1)), tot = ws.reduce((a, b) => a + b, 0);
    let r = Math.random() * tot, it = list[list.length - 1];
    for (let k = 0; k < list.length; k++) { r -= ws[k]; if (r <= 0) { it = list[k]; break; } }
    if (picked.length && picked[picked.length - 1].id === it.id && list.length > 1) continue;
    if (stateOf(it.id) === "n" && !used.has(it.id)) fresh++;
    used.add(it.id); picked.push(it);
  }
  return picked;
}

// ===== sound =====
let actx = null;
function beep(ok) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = ok ? "triangle" : "sawtooth";
    o.frequency.setValueAtTime(ok ? 660 : 160, t); if (ok) o.frequency.exponentialRampToValueAtTime(990, t + 0.08);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(ok ? 0.12 : 0.08, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + (ok ? 0.12 : 0.22));
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.25);
  } catch (e) {}
}

// ===== views =====
let view = "title", run = null, raf = null, peekId = null;
function setNav() { document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", (b.dataset.view === "map") === (view === "map") ? "true" : "false")); }
function setWide(on) { $("#screen").classList.toggle("wide", on); $("#wrap").classList.toggle("wide-on", on); }
function render() { setNav(); cancelAnimationFrame(raf); setWide(false); ({ title: renderTitle, run: renderCard, results: renderResults, map: renderMap })[view](); }
const meterHTML = c => `<div class="meter"><i class="a" style="width:${(c.a / (c.total || 1)) * 100}%"></i><i class="l" style="width:${((c.l + c.m) / (c.total || 1)) * 100}%"></i></div>`;

function renderTitle() {
  const all = counts(() => true);
  $("#screen").innerHTML = `
    <div class="label">${all.a} of ${all.total} cards automatic · ${prog.total.toLocaleString()} answered</div>
    <h2>Answer before you think</h2>
    <p class="small">${RUN_LEN} cards per run, LeetCode problems and ML questions in one stream. Misses come back a few cards later. A card is automatic after ${AUTO_STREAK} correct answers in a row, each under its target time.</p>
    <div class="modes">${MODES.map(([k, n, b, f]) => { const c = counts(f); const tg = CATS[k] ? ` · target ${CATS[k].target / 1000}s` : ""; return `<button class="mode" data-mode="${k}" aria-pressed="${mode === k}"><b>${n}</b><small>${b}</small><small>${c.a}/${c.total} automatic${tg}</small>${meterHTML(c)}</button>`; }).join("")}</div>
    <div class="row"><button class="btn" data-act="start">Start run</button><button class="btn ghost" data-act="sound">Sound: ${soundOn ? "on" : "off"}</button><span class="small kbd-only">Enter to start · 1–4 to answer</span></div>`;
}

function startRun() {
  prog.runs++; saveLocal();
  run = { queue: buildRun().map(i => ({ item: i, card: card(i), retry: 0 })), i: 0, combo: 0, best: 0, res: [], auto: 0, shownAt: 0, answered: null };
  view = "run"; run.shownAt = performance.now(); render();
}
function renderCard() {
  const r = run, e = r.queue[r.i], c = e.card, cat = CATS[c.cat], isLC = c.cat === "leetcode";
  setWide(isLC);
  const hud = `<div class="hud"><span class="cat">${cat.name}</span><span>${r.i + 1}/${r.queue.length}</span>${e.retry ? `<span style="color:var(--bad)">retry</span>` : ""}<span class="combo">combo <b>${r.combo}</b></span></div>
    <div class="track"><i style="width:${(r.i / r.queue.length) * 100}%"></i></div>
    <div class="clock" id="clock"><i id="clockbar"></i></div>`;
  const pad = `<div class="pad${isLC ? " one" : ""}" id="pad">${c.opts.map((o, k) => `<button class="opt" data-opt="${k}"><span class="k">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="fb" id="fb"><p class="hint kbd-only">Keys 1–4. Target ${cat.target / 1000}s.</p></div>`;
  $("#screen").innerHTML = isLC
    ? hud + `<div class="lcgrid"><div class="prob">${c.q}</div><div class="side"><p class="label" style="margin:0 0 8px">Which pattern solves this?</p>${pad}</div></div>`
    : hud + `<div class="card"><div class="q">${c.q}</div></div>${pad}`;
  const bar = $("#clockbar"), clock = $("#clock");
  const loop = () => { if (!run || run.answered || view !== "run") return; const t = performance.now() - run.shownAt, f = Math.min(1, t / cat.target); bar.style.width = f * 100 + "%"; clock.classList.toggle("late", t > cat.target); raf = requestAnimationFrame(loop); };
  loop();
}
function lcMore(c, k, ok) {
  const P = PATTERNS[c.p];
  let h = `<p class="label" style="margin-top:8px">Knowledge this problem needs</p><ul>${c.needs.map(n => `<li>${n}</li>`).join("")}</ul>`;
  if (!ok) { h += `<p class="label">How to spot ${P.name}</p><p>${P.recognize}</p>`; if (k >= 0) h += `<p class="label">When ${PATTERNS[c.keys[k]].name} fits instead</p><p>${PATTERNS[c.keys[k]].recognize}</p>`; }
  return h;
}
function answer(k) {
  const r = run; if (!r || r.answered || view !== "run") return;
  const e = r.queue[r.i], c = e.card, ms = performance.now() - r.shownAt, ok = k === c.ans;
  r.answered = { k, ok, ms };
  const out = record(c, k, ok, ms);
  if (out.becameAuto) r.auto++;
  r.res.push({ id: c.id, cat: c.cat, t: c.t || c.q, a: c.opts[c.ans], ok, ms, x: c.x });
  if (ok) { r.combo++; r.best = Math.max(r.best, r.combo); } else r.combo = 0;
  if (!ok && e.retry < 2) r.queue.splice(Math.min(r.queue.length, r.i + 4), 0, { item: e.item, card: card(e.item), retry: e.retry + 1 });
  beep(ok); cancelAnimationFrame(raf);
  document.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (j === c.ans) b.classList.add("right"); if (j === k && !ok) b.classList.add("wrong"); });
  const fast = ms <= CATS[c.cat].target, isLC = c.cat === "leetcode";
  const more = isLC ? lcMore(c, k, ok) : "";
  $("#pad").classList.add(ok ? "flash-ok" : "flash-no");
  const nextBtn = `<button class="btn" data-act="next" style="margin-top:6px${isLC ? ";width:100%" : ""}">Next</button><span class="small kbd-only" style="margin-left:10px">Enter</span>`;
  $("#fb").innerHTML = ok
    ? `<span class="verdict ok">${fast ? "Clean" : "Correct, slow"}</span><span class="ms">${secs(ms)}${out.becameAuto ? " · now automatic" : ""}</span>${fast ? "" : `<p class="small">${c.x}</p>${more}${nextBtn}`}`
    : `<span class="verdict no">Miss</span><span class="ms">${secs(ms)} · comes back in a few cards</span><p>${c.x}</p>${more}${nextBtn}`;
  if (ok && fast) setTimeout(() => { if (run === r && r.answered && view === "run") next(); }, isLC ? 700 : 420);
}
function next() {
  const r = run; if (!r) return;
  if (view === "results") return startRun();
  if (!r.answered) return;
  r.i++; r.answered = null;
  if (r.i >= r.queue.length) { view = "results"; persist(true); return render(); }
  r.shownAt = performance.now(); renderCard(); window.scrollTo && window.scrollTo(0, 0);
}
function renderResults() {
  const r = run, res = r.res, right = res.filter(x => x.ok).length;
  const times = res.filter(x => x.ok).map(x => x.ms).sort((a, b) => a - b), med = times.length ? times[Math.floor(times.length / 2)] : 0;
  const misses = [], seen = new Set(); res.filter(x => !x.ok).forEach(x => { if (!seen.has(x.id)) { seen.add(x.id); misses.push(x); } });
  const all = counts(MODE[mode][3]);
  $("#screen").innerHTML = `
    <div class="label">Run ${prog.runs} · ${MODE[mode][1]}</div>
    <h2>${right} / ${res.length}</h2>
    <div class="stats">
      <div class="stat"><span class="label">Median</span><b>${times.length ? secs(med) : "—"}</b></div>
      <div class="stat"><span class="label">Best combo</span><b>${r.best}</b></div>
      <div class="stat"><span class="label">New automatic</span><b>${r.auto}</b></div>
      <div class="stat"><span class="label">Automatic</span><b>${all.a}/${all.total}</b></div>
    </div>
    ${misses.length ? `<div class="label">Missed</div><ul class="misslist">${misses.slice(0, 10).map(m => `<li><div class="small">${CATS[m.cat].name}</div><div>${m.t}</div><div class="ans">${esc(m.a)}</div><div class="small">${m.x}</div></li>`).join("")}</ul>` : `<p>No misses.</p>`}
    <div class="row"><button class="btn" data-act="start">Run again</button><button class="btn ghost" data-act="title">Change mode</button><button class="btn ghost" data-view="map">My patterns</button><span class="small kbd-only">Enter to run again</span></div>`;
}

function renderMap() {
  const all = counts(() => true);
  const catRows = CAT_ORDER.map(c => { const s = prog.cats[c] || { n: 0, c: 0, ms: 0 }; return { c, n: s.n, acc: s.n ? s.c / s.n : null, avg: s.n ? s.ms / s.n : null, cnt: counts(i => i.cat === c) }; });
  const patRows = ORDER.map(p => { const s = prog.pat[p] || { n: 0, c: 0, ms: 0 }; return { p, n: s.n, acc: s.n ? s.c / s.n : null, m: mastery(p), avg: s.n ? s.ms / s.n : null }; });
  const conf = Object.entries(prog.conf || {}).filter(([k]) => { const [g, a] = k.split("|"); return PATTERNS[g] && PATTERNS[a]; }).sort((a, b) => b[1] - a[1]);
  const ins = [];
  if (!prog.total) ins.push("Nothing answered yet. One run of 30 is enough to see where you stand.");
  const wc = catRows.filter(r => r.n >= 5).sort((a, b) => a.acc - b.acc)[0]; if (wc) ins.push(`Weakest category: <strong>${CATS[wc.c].name}</strong>, ${pct(wc.acc)} correct.`);
  const wp = patRows.filter(r => r.n >= 3).sort((a, b) => a.m - b.m)[0]; if (wp) ins.push(`Weakest LeetCode pattern: <strong>${PATTERNS[wp.p].name}</strong>, ${pct(wp.m)} on recent answers.`);
  if (conf.length) { const [g, a] = conf[0][0].split("|"); ins.push(`Most common mix-up: answering <strong>${PATTERNS[g].name}</strong> when it's <strong>${PATTERNS[a].name}</strong> (${conf[0][1]}×).`); }
  const slow = catRows.filter(r => r.n >= 5).sort((a, b) => b.avg / CATS[b.c].target - a.avg / CATS[a.c].target)[0]; if (slow && slow.avg > CATS[slow.c].target) ins.push(`Slowest against target: <strong>${CATS[slow.c].name}</strong>, ${secs(slow.avg)} average vs ${CATS[slow.c].target / 1000}s.`);
  const legend = `<div class="legend"><span><i style="background:var(--dim)"></i>Not seen</span><span><i style="background:var(--bad)"></i>Missed last time</span><span><i style="background:var(--learn)"></i>Learning</span><span><i style="background:var(--good)"></i>Automatic</span></div>`;
  const blocks = CAT_ORDER.map(cat => {
    const its = ITEMS.filter(i => i.cat === cat), c = counts(i => i.cat === cat);
    return `<div class="catblock"><div class="cathead"><b>${CATS[cat].name}</b><span class="small">${c.a}/${c.total} automatic · target ${CATS[cat].target / 1000}s</span></div>
      <div class="grid">${its.map(i => `<button class="cell ${stateOf(i.id)}" data-peek="${i.id}" aria-pressed="${peekId === i.id}" aria-label="${esc(i.label || i.a || i.id)}"></button>`).join("")}</div>
      ${peekId && BY_ID[peekId].cat === cat ? peekHTML(BY_ID[peekId]) : ""}</div>`;
  }).join("");
  $("#screen").innerHTML = `<div class="label">My patterns</div><h2>${all.a} of ${all.total} automatic</h2>
    <div class="stats">
      <div class="stat"><span class="label">Answered</span><b>${prog.total.toLocaleString()}</b></div>
      <div class="stat"><span class="label">Correct</span><b>${pct(prog.total ? prog.correct / prog.total : null)}</b></div>
      <div class="stat"><span class="label">Runs</span><b>${prog.runs}</b></div>
      <div class="stat"><span class="label">Days</span><b>${Object.keys(prog.days).length}</b></div>
    </div>
    <div class="box"><h3>What the data says</h3><ul class="insights">${ins.map(x => `<li>${x}</li>`).join("")}</ul></div>
    <div class="box"><h3>By category</h3><div class="wide-t"><table><tr><th>Category</th><th class="n">Seen</th><th class="n">Correct</th><th class="n">Avg time</th><th class="n">Automatic</th></tr>
      ${catRows.map(r => `<tr><td>${CATS[r.c].name}</td><td class="n">${r.n}</td><td class="n">${pct(r.acc)}</td><td class="n">${r.avg === null ? "—" : secs(r.avg)}</td><td class="n">${r.cnt.a}/${r.cnt.total}</td></tr>`).join("")}</table></div></div>
    <div class="box"><h3>LeetCode patterns</h3><div class="wide-t"><table><tr><th>Pattern</th><th class="n">Seen</th><th class="n">Correct</th><th class="n">Recent</th><th class="n">Avg time</th></tr>
      ${patRows.map(r => `<tr><td>${PATTERNS[r.p].name}</td><td class="n">${r.n}</td><td class="n">${pct(r.acc)}</td><td class="n">${pct(r.m)}</td><td class="n">${r.avg === null ? "—" : secs(r.avg)}</td></tr>`).join("")}</table></div>
      ${conf.length ? `<p class="label" style="margin-top:14px">Mix-ups</p><div class="wide-t"><table><tr><th>It was</th><th>You answered</th><th class="n">Times</th></tr>${conf.slice(0, 8).map(([k, n]) => { const [g, a] = k.split("|"); return `<tr><td>${PATTERNS[a].name}</td><td>${PATTERNS[g].name}</td><td class="n">${n}</td></tr>`; }).join("")}</table></div>` : ""}</div>
    ${legend}${blocks}
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="reset" id="resetBtn">Reset all progress</button></div>`;
}
function peekHTML(item) {
  const s = st(item.id);
  const stat = s ? `${s.c}/${s.n} correct · fast streak ${s.fs}/${AUTO_STREAK}${s.best ? ` · best ${secs(s.best)}` : ""}` : "Not seen yet";
  if (item.lc) return `<div class="peek"><div class="label">LeetCode problem type · ${stat}</div><div style="margin:6px 0">${item.lc.stories.map(x => x.title).join(" / ")}</div><div style="color:var(--good);font-weight:600">${PATTERNS[item.p].name}</div><div class="small">${item.lc.why}</div></div>`;
  const c = makeCard(item);
  return `<div class="peek"><div class="label">${item.gen ? "Generated · " + esc(item.label) : "Card"} · ${stat}</div><div style="margin:6px 0">${c.q}</div><div style="color:var(--good);font-weight:600">${esc(c.opts[c.ans])}</div><div class="small">${c.x}</div></div>`;
}

// ===== events =====
let resetArmed = false;
document.addEventListener("click", e => {
  const t = e.target.closest("[data-view],[data-mode],[data-act],[data-opt],[data-peek]"); if (!t) return;
  if (t.dataset.view) {
    if (t.dataset.view === "map") view = "map";
    else if (run && run.i < run.queue.length) { view = "run"; if (!run.answered) run.shownAt = performance.now(); }
    else view = "title";
    resetArmed = false; return render();
  }
  if (t.dataset.mode) { mode = t.dataset.mode; try { localStorage.setItem(LKEY + "-mode", mode); } catch (err) {} return render(); }
  if (t.dataset.opt) return answer(+t.dataset.opt);
  if (t.dataset.peek) { peekId = peekId === t.dataset.peek ? null : t.dataset.peek; return render(); }
  const a = t.dataset.act;
  if (a === "start") return startRun();
  if (a === "next") return next();
  if (a === "title") { view = "title"; return render(); }
  if (a === "sound") { soundOn = !soundOn; try { localStorage.setItem(LKEY + "-sound", soundOn ? "on" : "off"); } catch (err) {} if (soundOn) beep(true); return render(); }
  if (a === "reset") {
    if (!resetArmed) { resetArmed = true; t.textContent = "Click again to erase everything"; return; }
    prog = EMPTY(); prog.migratedLC = true; run = null; resetArmed = false; persist(true); render();
  }
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (view === "run" && run && !run.answered && /^[1-4]$/.test(e.key)) { e.preventDefault(); return answer(+e.key - 1); }
  if (e.key === "Enter" || e.key === " ") {
    if (view === "title" || view === "results") { e.preventDefault(); return startRun(); }
    if (view === "run" && run && run.answered) { e.preventDefault(); return next(); }
  }
  if (e.key === "Escape" && view === "run") { view = "title"; run = null; render(); }
});

renderFoot();
render();
initSync();
</script>
